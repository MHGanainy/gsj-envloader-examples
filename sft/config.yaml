# =========================================================================
# sft/config.yaml — endpoint-only (CP-31 of the library's M7 staging arc)
# =========================================================================
# ONE file drives everything `python train.py` does (library §9 realized:
# `collect_episodes(config)` seeds the store IN-PROCESS — no CLI — and
# `make_loader(config)` serves it). Derived from the library's reference
# consumer config, staging/config.staging.yaml. Field reference:
# docs/config-reference.md. Every environment input is an endpoint or a
# sha-pinned artifact:
#
#   cases     -> staging Forgejo clone URLs (the frozen dataset)
#   pins      -> staging-inputs raw URL + sha256
#   taskbank  -> the COMMITTED per-project parquet (byte-identical to the
#                hosted staging artifact — same sha256; URL alternative
#                commented in place)
#   retrieval -> the external MCP service URL (per-episode JWT, remote)
#   image     -> the published GHCR tag
#   serving   -> the always-on student vLLM endpoint
#
# What a consumer edits (the whole list):
#   1. endpoint hosts (Forgejo, MCP service, serving) — deployment topology;
#   2. the consumer-owned scratch paths (store.root, task.work_root,
#      task.episodes_root) + the taskbank's absolute path;
#   3. user: (lr/steps/out — the developer's half; never read by the library).

store:
  # Consumer-owned scratch: the store is created here.
  root: /home/sysadmin/gsj-envloader-examples/sft/store
  config:
    max_serves_per_record: 1     # §7 posture: retire on first committed serve

task:
  # Consumer-owned scratch: per-case checkouts + per-episode forensics.
  work_root: /home/sysadmin/gsj-envloader-examples/sft/work
  episodes_root: /home/sysadmin/gsj-envloader-examples/sft/store/episodes
  # templates_dir OMITTED: the render templates ship as wheel package data.
  #
  # The frozen case dataset, cloned by URL from the staging Forgejo
  # (anonymous read; repo paths + ref->SHAs are the frozen contract).
  clone_url_for: "http://172.28.9.10:3000/gsj-admin/{case_id}.git"
  pi_launch:
    # Schema-required but DEAD in docker mode (library H-33): the container
    # runs its own baked paths. In-image values kept as self-documentation.
    entry: /opt/pi/node_modules/@earendil-works/pi-coding-agent/dist/cli.js
    extension: /opt/pi/node_modules/pi-mcp-extension/src/index.ts
    model_id: Qwen/Qwen3-0.6B    # who acts — must match serving.model
    context_window: 32768
  mcp_launch:
    # Retrieval is an ENDPOINT: the external MCP service (streamable-http),
    # per-episode JWT minted at render, URL rewritten for the container by
    # the library. No pages_root, no server path, no in_image — the
    # stdio-shim world is gone.
    transport: streamable-http
    url_base: "http://127.0.0.1:8790"
    # The NAME of the env var holding the HMAC secret — never a value in
    # this file. Export GSJ_MCP_TOKEN_SECRET before `python train.py`.
    token_secret: GSJ_MCP_TOKEN_SECRET
    token_ttl_s: 3600
  tools_allowlist:
    [read, ls, grep, find, write, edit, bash,
     mcp_gsj_search_case, mcp_gsj_search_decisions,
     mcp_gsj_case_status, mcp_gsj_decision_stats]
  budgets:
    wall_timeout_s: 480.0
  execution: docker
  docker:
    # The published staging image, by GHCR tag. This H200's dockerd has no
    # registry egress, so the image arrived by docker save|load and pull
    # stays false; an egress-capable host sets pull: true for one automatic
    # pull before the first episode.
    image: ghcr.io/mhganainy/gsj-pi-harness:pi0.83.0-3
    pull: false

collector:
  # Provenance statics — recorded into every episode.
  harness_image: ghcr.io/mhganainy/gsj-pi-harness:pi0.83.0-3
  pi_version: "0.83.0"
  uniagent_sha: 73b0f41efa88b311fd69129c6f835c012e925e73
  collector_run_id: zero-cli-sft
  # The staging gate pins, consumed BY URL with the sha256 pin: integrity
  # enforced, fetch content-addressed-cached. Pins are environment-specific
  # DATA — a different estate regenerates its own (gsj-pin).
  pins_path: "http://172.28.9.10:3000/gsj-admin/staging-inputs/raw/branch/main/pins.staging.json"
  pins_sha256: bfa66b262765c57f5c662d9845860d003c7b0cf72e596b47a6005a537e12598b
  sampling_student: {temperature: 0.6, top_p: 0.95, top_k: 20}
  sampling_eval: {temperature: 0.6, top_p: 0.95, top_k: 20}
  concurrency: 2
  seeding:
    # collect_episodes(config) reads these (args > collector.seeding >
    # user.seeding): 9 NEW trainable episodes, bounded by the deadline.
    episodes: 9
    deadline_s: 1800

rollout:
  behavior: student
  target_completions_per_row: 1
  max_attempts_per_row: 3
  regenerate: wait_all
  seed: 0

taskbank:
  # DEFAULT: the committed per-project bank — the repo shows its data
  # (12 rows: 9 train / 3 eval, case_0004 = eval; ../build_taskbank.py
  # regenerates it from the public case refs). The sha256 pin verifies the
  # LOCAL file too, and it equals the hosted staging artifact's sha —
  # local vs URL are the same bytes; pick either. The URL alternative:
  # path: "http://172.28.9.10:3000/gsj-admin/staging-inputs/raw/branch/main/taskbank.parquet"
  path: /home/sysadmin/gsj-envloader-examples/sft/taskbank.parquet
  sha256: 9eb8e3c2d3760b9b74c4cda20394fd54bd12f95e78d397dbd40631f801eb19da

serving:
  # The always-on student endpoint (staging estate; loopback forward).
  base_url: http://127.0.0.1:8100/v1
  model: Qwen/Qwen3-0.6B

driver:
  # Host-portable codec pin pair, resolved through the HF cache.
  model_id: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca

loader:
  # The trainer half of the same file.
  batch_size: 2
  poll_s: 0.25
  starve_log_every: 8
  timeout_s: 30.0
  ready:
    # SFT's serving predicate: completed episodes only. Hygiene
    # (infra_error, gate failures) applies BELOW any ready, always.
    env.outcome.finish_state: completed

user:
  # The developer's half — never read by the library; train.py reads these.
  lr: 1.0e-4
  steps: 4
  out: adapters/run1
