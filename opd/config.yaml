# =========================================================================
# opd/config.yaml — endpoint-only (CP-31 of the library's M7 staging arc)
# =========================================================================
# ONE file drives everything `python train.py` does: collect_episodes
# (in-process), teacher scoring (in-process, against the ALWAYS-ON teacher
# endpoint — train.py's TEACHER constant; no serve swap exists anymore),
# and the loader. Derived from the library's staging/config.staging.yaml;
# field reference: docs/config-reference.md. sft/config.yaml carries the
# long-form field commentary — the three projects deliberately duplicate
# this file shape.
#
# Since the CP-33 config split this file carries the LIBRARY SURFACE ONLY.
# The teacher endpoint lives in train.py's TEACHER constant: the library's
# `serving:` section is the single student endpoint (strict schema, one
# URL); teacher scoring is consumer craft — §9's developer half — so its
# identity and URL are consumer code. (CP-31 homed it under `user:`; CP-33
# moved it to the constants block with the other training parameters.)

store:
  root: /home/sysadmin/gsj-envloader-examples/opd/store
  config:
    # On-policy is enforced by the ready's `serve_count: 0`; 1 is posture.
    max_serves_per_record: 1

task:
  work_root: /home/sysadmin/gsj-envloader-examples/opd/work
  episodes_root: /home/sysadmin/gsj-envloader-examples/opd/store/episodes
  # templates_dir omitted — wheel package data.
  clone_url_for: "http://172.28.9.10:3000/gsj-admin/{case_id}.git"
  pi_launch:
    # Schema-required, dead in docker mode (H-33) — in-image paths as docs.
    entry: /opt/pi/node_modules/@earendil-works/pi-coding-agent/dist/cli.js
    extension: /opt/pi/node_modules/pi-mcp-extension/src/index.ts
    model_id: Qwen/Qwen3-0.6B    # behavior == trainee: the 0.6B acts
    context_window: 32768
  mcp_launch:
    transport: streamable-http
    url_base: "http://127.0.0.1:8790"
    token_secret: GSJ_MCP_TOKEN_SECRET
    token_ttl_s: 3600
  tools_allowlist:
    [read, ls, grep, find, write, edit, bash,
     mcp_gsj_search_case, mcp_gsj_search_decisions,
     mcp_gsj_case_status, mcp_gsj_decision_stats]
  budgets:
    wall_timeout_s: 480.0
  execution: docker
  docker:
    image: ghcr.io/mhganainy/gsj-pi-harness:pi0.83.0-3
    pull: false                  # this H200's dockerd has no egress (save|load)

collector:
  harness_image: ghcr.io/mhganainy/gsj-pi-harness:pi0.83.0-3
  pi_version: "0.83.0"
  uniagent_sha: 73b0f41efa88b311fd69129c6f835c012e925e73
  collector_run_id: zero-cli-opd
  pins_path: "http://172.28.9.10:3000/gsj-admin/staging-inputs/raw/branch/main/pins.staging.json"
  pins_sha256: bfa66b262765c57f5c662d9845860d003c7b0cf72e596b47a6005a537e12598b
  sampling_student: {temperature: 0.6, top_p: 0.95, top_k: 20}
  sampling_eval: {temperature: 0.6, top_p: 0.95, top_k: 20}
  concurrency: 2
  seeding:
    episodes: 9
    deadline_s: 1800

rollout:
  behavior: student
  target_completions_per_row: 1
  max_attempts_per_row: 3
  regenerate: wait_all
  seed: 0

taskbank:
  # DEFAULT: the committed bank (repo shows its data); sha equals the
  # hosted staging artifact — same bytes either way. URL alternative:
  # path: "http://172.28.9.10:3000/gsj-admin/staging-inputs/raw/branch/main/taskbank.parquet"
  path: /home/sysadmin/gsj-envloader-examples/opd/taskbank.parquet
  sha256: 9eb8e3c2d3760b9b74c4cda20394fd54bd12f95e78d397dbd40631f801eb19da

serving:
  # The STUDENT endpoint — generation at collection. The teacher is its
  # own always-on endpoint, named by train.py's TEACHER constant.
  base_url: http://127.0.0.1:8100/v1
  model: Qwen/Qwen3-0.6B

driver:
  model_id: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca

loader:
  batch_size: 2
  poll_s: 0.25
  starve_log_every: 8
  timeout_s: 30.0
  ready:
    # Scored, fresh, strictly on-policy. `truncated` IS trainable — OPD
    # has valid per-token signal on truncated episodes. `opd._complete`
    # gates on the scorer having run; `serve_count: 0` excludes any
    # re-serve regardless of the store knob.
    env.outcome.finish_state: {in: [completed, truncated]}
    opd._complete: true
    policy_lag: {lte: 0}
    serve_count: 0
  mix:
    env.policy.behavior: {student: 1.0}
